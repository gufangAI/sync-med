<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* 系统自带宋体用 local() 声明 —— 不声明的话渲染器不知道去哪儿取,会悄悄退回无衬线,字全变样 */
      @font-face { font-family: "GFSerif"; src: local("Noto Serif SC"), local("Source Han Serif SC"),
                   local("Songti SC"), local("STSong"), local("SimSun"), local("Microsoft YaHei"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14100c; }
      body { font-family: "GFSerif", serif; color: #f0e6d2; }

      /* 暖光晕 —— 纯黑底显廉价,古籍质感要有纸的温度 */
      #grain { position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 900px 700px at 50% 16%, rgba(180,141,77,.17), transparent 70%),
          radial-gradient(ellipse 700px 900px at 50% 88%, rgba(180,141,77,.10), transparent 70%); }

      .clip { position: absolute; inset: 0; }
      /* 场景内容统一包一层 inner:clip 的可见性归框架管,淡出只能作用在 inner 上,
         否则非线性 seek 会和框架抢 opacity,留下脏状态 */
      .sceneInner { position: absolute; inset: 0; }
      .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }

      .hookNum { font-size: 300px; font-weight: 700; line-height: .95; color: #d4af6e;
        font-variant-numeric: tabular-nums; text-shadow: 0 0 90px rgba(212,175,110,.38); }
      .hookUnit { font-size: 76px; letter-spacing: .2em; text-indent: .2em; color: #e6d9bf; margin-top: 8px; }
      .hookLine { margin-top: 58px; font-size: 84px; font-weight: 700; letter-spacing: .14em; text-indent: .14em; color: #f4ead6; }
      .hookSub { margin-top: 34px; font-size: 44px; letter-spacing: .3em; text-indent: .3em; color: #b48d4d; }

      .booksWrap { padding: 0 86px; width: 100%; }
      .bookRow { margin-bottom: 66px; }
      .bookName { font-size: 46px; color: #b48d4d; letter-spacing: .1em; margin-bottom: 22px; }
      .herbLine { font-size: 54px; line-height: 1.66; color: #efe4cd; letter-spacing: .05em; }
      .herbLine em { font-style: normal; font-weight: 700; }
      .sameNote { margin-top: 20px; font-size: 40px; color: #8f7c5c; letter-spacing: .16em; }

      .bigStat { text-align: center; margin: 40px 0; }
      .bigStat .num { font-size: 208px; font-weight: 700; line-height: 1; color: #d4af6e;
        font-variant-numeric: tabular-nums; text-shadow: 0 0 70px rgba(212,175,110,.3); }
      .bigStat .lbl { margin-top: 16px; font-size: 46px; letter-spacing: .32em; text-indent: .32em; color: #e6d9bf; }

      /* 关系网:同心环 + 定角点阵。比粒子爆炸稳,且完全确定 —— 渲染要求每帧可重现 */
      .netWrap { position: relative; width: 760px; height: 760px; }
      .ring { position: absolute; inset: 0; margin: auto; border: 1px solid rgba(180,141,77,.30); border-radius: 50%; }
      .dot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px;
             background: #d4af6e; border-radius: 50%; opacity: 0; box-shadow: 0 0 16px rgba(212,175,110,.7); }
      .netStat { position: absolute; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; text-align: center; }
      .netStat .n { font-size: 116px; font-weight: 700; color: #f4ead6; font-variant-numeric: tabular-nums; }
      .netStat .t { margin-top: 10px; font-size: 38px; letter-spacing: .22em; text-indent: .22em; color: #b48d4d; }

      .headline { font-size: 60px; line-height: 1.6; letter-spacing: .1em; color: #efe4cd; text-align: center; padding: 0 110px; }
      .headline b { color: #d4af6e; font-weight: 700; }
      .herbGrid { display: flex; flex-direction: column; gap: 30px; padding: 0 116px; width: 100%; margin-top: 66px; }
      .hbar { display: flex; align-items: center; gap: 26px; }
      .hbar .hn { width: 128px; font-size: 52px; color: #f0e6d2; letter-spacing: .05em; }
      .hbar .track { flex: 1; height: 20px; background: rgba(180,141,77,.16); border-radius: 2px; overflow: hidden; }
      .hbar .fill { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #8a6a34, #d4af6e); }
      .hbar .hv { width: 110px; font-size: 38px; color: #b48d4d; text-align: right; font-variant-numeric: tabular-nums; }

      /* 落款 —— 专家会诊结论:知识类内容的转发动机是"资源占有欲",落款要落在"以后查得到" */
      .brand { font-size: 100px; letter-spacing: .3em; text-indent: .3em; color: #f4ead6; }
      .brandSub { margin-top: 34px; font-size: 42px; letter-spacing: .16em; text-indent: .16em; color: #d4af6e; }
      .brandSub2 { margin-top: 20px; font-size: 36px; letter-spacing: .16em; text-indent: .16em; color: #8f7c5c; }
      /* 合规尾板(创始人钦定:主语是文献、非诊疗、无二维码无外链) */
      .legal { position: absolute; bottom: 104px; left: 0; right: 0; text-align: center;
               font-size: 32px; letter-spacing: .2em; text-indent: .2em; color: #6f6250; }
    </style>
  </head>
  <body>
    <div id="grain"></div>

    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">

      <div id="s1" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="sceneInner" id="s1i">
          <div class="center">
            <div class="hookNum" id="hn">0</div>
            <div class="hookUnit" id="hu">個版本</div>
            <div class="hookLine" id="hl">同一首方</div>
            <div class="hookSub" id="hs">見於 89 部古籍</div>
          </div>
        </div>
      </div>

      <div id="s2" class="clip" data-start="6" data-duration="7" data-track-index="1">
        <div class="sceneInner" id="s2i">
          <div class="center">
            <div class="booksWrap">
              <div class="bookRow" id="b1">
                <div class="bookName">《傷寒論注》</div>
                <div class="herbLine"><em>柴胡</em>、<em>半夏</em>、<em>人參</em>、<em>甘草</em>、<em>黃芩</em>、<em>生薑</em>、大棗</div>
              </div>
              <div class="bookRow" id="b2">
                <div class="bookName">《丹溪心法》</div>
                <div class="herbLine"><em>柴胡</em>、<em>黃芩</em>、<em>人參</em>、<em>甘草</em>、<em>半夏</em>、<em>生薑</em>、棗</div>
              </div>
              <div class="sameNote" id="b3">同一首方，各家用字不同</div>
            </div>
          </div>
        </div>
      </div>

      <div id="s3" class="clip" data-start="13" data-duration="6" data-track-index="1">
        <div class="sceneInner" id="s3i">
          <div class="center">
            <div class="bigStat"><div class="num" id="g1">0</div><div class="lbl">部典籍</div></div>
            <div class="bigStat"><div class="num" id="g2">0</div><div class="lbl">首結構化方劑</div></div>
          </div>
        </div>
      </div>

      <div id="s4" class="clip" data-start="19" data-duration="5" data-track-index="1">
        <div class="sceneInner" id="s4i">
          <div class="center">
            <div class="netWrap" id="net">
              <div class="ring" style="width:760px;height:760px"></div>
              <div class="ring" style="width:560px;height:560px"></div>
              <div class="ring" style="width:360px;height:360px"></div>
              <div class="netStat">
                <div class="n" id="e1">0</div>
                <div class="t">條關係邊</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="s5" class="clip" data-start="24" data-duration="3.5" data-track-index="1">
        <div class="sceneInner" id="s5i">
          <div class="center">
            <div class="headline" id="s5h">六味主藥　<b>過半典籍共見</b></div>
            <div class="herbGrid">
              <div class="hbar"><span class="hn">生薑</span><span class="track"><span class="fill" data-pct="100"></span></span><span class="hv">56</span></div>
              <div class="hbar"><span class="hn">人參</span><span class="track"><span class="fill" data-pct="98"></span></span><span class="hv">55</span></div>
              <div class="hbar"><span class="hn">柴胡</span><span class="track"><span class="fill" data-pct="98"></span></span><span class="hv">55</span></div>
              <div class="hbar"><span class="hn">甘草</span><span class="track"><span class="fill" data-pct="91"></span></span><span class="hv">51</span></div>
              <div class="hbar"><span class="hn">黃芩</span><span class="track"><span class="fill" data-pct="91"></span></span><span class="hv">51</span></div>
              <div class="hbar"><span class="hn">半夏</span><span class="track"><span class="fill" data-pct="86"></span></span><span class="hv">48</span></div>
            </div>
          </div>
        </div>
      </div>

      <div id="s6" class="clip" data-start="27.5" data-duration="2.5" data-track-index="1">
        <div class="sceneInner" id="s6i">
          <div class="center">
            <div class="brand" id="s6b">古方 AI</div>
            <div class="brandSub" id="s6s">近六萬首古籍方劑　逐字可回查原文</div>
            <div class="brandSub2" id="s6t">下次查方，記得回來</div>
          </div>
          <div class="legal" id="s6l">古籍文獻整理 ・ 僅供研習 ・ 非診療建議</div>
        </div>
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const SC = '[data-composition-id="main"] ';   // 选择器一律加作用域,否则打包后会误伤别的合成

      // 数字滚动:必须用 GSAP 的 innerText 属性补间,不能用 onUpdate 写 DOM。
      // 血证(2026-07-26 实测):onUpdate 版本在渲染器逐帧 seek 时【数字永远停在 0】——
      // seek 默认 suppressEvents,回调不触发;即便强制触发,来回 seek 也会把闭包变量污染成 0。
      // 属性补间是 tween 状态的一部分,seek 到任意帧都会被正确重算。
      const roll = (sel, to, at, dur) => {
        tl.to(sel, { innerText: to, snap: { innerText: 1 }, duration: dur, ease: "power2.out" }, at);
      };

      // ① 钩子:数字先砸出来,再交代它是什么 —— 反差在前,解释在后
      tl.from("#hn", { opacity: 0, scale: 1.25, filter: "blur(20px)", duration: 0.9, ease: "power3.out" }, 0.15);
      roll("#hn", 133, 0.3, 1.3);
      tl.from("#hu", { opacity: 0, y: 26, duration: 0.6 }, 1.5)
        .from("#hl", { opacity: 0, y: 34, duration: 0.8, ease: "power2.out" }, 2.2)
        .from("#hs", { opacity: 0, duration: 0.8 }, 3.1)
        .to("#s1i", { opacity: 0, duration: 0.5 }, 5.5);

      // ② 两部典籍先后落下,共有的六味依次点亮 —— 共性与差异同屏
      tl.fromTo("#b1", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 6.3)
        .fromTo("#b2", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 7.9)
        .fromTo("#b3", { opacity: 0 }, { opacity: 1, duration: 0.7 }, 9.5)
        .fromTo(SC + "em", { color: "#efe4cd" }, { color: "#d4af6e", duration: 0.24, stagger: 0.11, ease: "none" }, 10.2)
        .to("#s2i", { opacity: 0, duration: 0.5 }, 12.5);

      // ③ 拉远:从一首方到整座库
      tl.from("#g1", { opacity: 0, y: 34, duration: 0.6 }, 13.3);
      roll("#g1", 691, 13.4, 1.2);
      tl.from("#g2", { opacity: 0, y: 34, duration: 0.6 }, 15.2);
      roll("#g2", 59414, 15.3, 1.5);
      tl.to("#s3i", { opacity: 0, duration: 0.5 }, 18.5);

      // ④ 关系网:节点沿三层同心环点亮。角度写死,无 Math.random —— 渲染必须每帧可重现
      const net = document.getElementById("net");
      [{ r: 380, n: 18 }, { r: 280, n: 14 }, { r: 180, n: 10 }].forEach((ring, ri) => {
        for (let i = 0; i < ring.n; i++) {
          const a = (i / ring.n) * Math.PI * 2 + ri * 0.21;
          const d = document.createElement("div");
          d.className = "dot";
          d.style.left = (380 + Math.cos(a) * ring.r) + "px";
          d.style.top = (380 + Math.sin(a) * ring.r) + "px";
          net.appendChild(d);
        }
      });
      tl.from(SC + ".ring", { scale: 0.8, opacity: 0, duration: 0.8, stagger: 0.12, ease: "power2.out" }, 19.2)
        .to(SC + ".dot", { opacity: 1, duration: 0.3, stagger: 0.022, ease: "none" }, 19.5)
        .from(SC + ".netStat", { opacity: 0, duration: 0.6 }, 20.4);
      roll("#e1", 259686, 20.5, 1.8);
      tl.to("#s4i", { opacity: 0, duration: 0.5 }, 23.5);

      // ⑤ 频次条生长
      tl.from("#s5h", { opacity: 0, y: 22, duration: 0.6 }, 24.2)
        .from(SC + ".hbar", { opacity: 0, x: -20, duration: 0.4, stagger: 0.1 }, 24.4);
      document.querySelectorAll(SC + ".fill").forEach((el, i) => {
        tl.to(el, { width: el.dataset.pct + "%", duration: 0.8, ease: "power2.out" }, 24.5 + i * 0.1);
      });
      tl.to("#s5i", { opacity: 0, duration: 0.4 }, 27.1);

      // ⑥ 落款 —— 尾板完整停留到最后一帧
      tl.from("#s6b", { opacity: 0, scale: 0.94, filter: "blur(10px)", duration: 0.9, ease: "power2.out" }, 27.7)
        .from("#s6s", { opacity: 0, y: 20, duration: 0.6 }, 28.3)
        .from("#s6t", { opacity: 0, y: 16, duration: 0.6 }, 28.7)
        .from("#s6l", { opacity: 0, duration: 0.6 }, 29.0);

      // 硬归零:非线性 seek 可能落在淡出之后,必须显式 set,否则残留上一场的可见状态
      tl.set("#s1i", { opacity: 0 }, 6);
      tl.set("#s2i", { opacity: 0 }, 13);
      tl.set("#s3i", { opacity: 0 }, 19);
      tl.set("#s4i", { opacity: 0 }, 24);
      tl.set("#s5i", { opacity: 0 }, 27.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

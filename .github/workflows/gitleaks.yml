# 凭据泄漏哨兵 —— 整合队列#3(gitleaks,MIT官方binary)。公开仓最高危,push即扫。
name: Gitleaks
on:
  push:
  pull_request:
  schedule:
    - cron: '30 2 * * *'      # 每日 UTC 02:30 全量兜底(防被绕过单次 push)
permissions:
  contents: read
  issues: write
concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 全历史,不只 diff
      - name: 下载官方 binary(组织仓用 action 需 license key,binary 直跑绕开)
        run: |
          v=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks version
      - name: 扫描(命中不中断,交给下一步开 Issue)
        id: scan
        run: |
          ./gitleaks git . --report-path leaks.json --exit-code 0
          n=$(python3 -c "import json;print(len(json.load(open('leaks.json'))))")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "命中 $n 条" >> "$GITHUB_STEP_SUMMARY"
      - name: 命中则开/更新 Issue(治「只写日志=没人看」)
        if: steps.scan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T='🔑 凭据泄漏哨兵告警'
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "## $(date -u +%Y-%m-%dT%H:%M) · run ${{ github.run_id }}"
            echo "gitleaks 命中 **${{ steps.scan.outputs.count }}** 条,详见 artifact。"
            echo "误报请加进 .gitleaks.toml allowlist;真泄漏立即轮换凭据+删历史。"
          } > body.md
          if [ -n "$num" ]; then gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body-file body.md
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$T" --body-file body.md; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: leaks.json
          if-no-files-found: ignore

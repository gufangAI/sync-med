# ============================================================
# 自进化闭环 · Improve 环(真正闭上口的那一环)
#
# 立此因(2026-08-04 创始人):
#   「要抓紧完成这个闭环,这是最值钱的部分,我们就真的要开始融钱了」
#   「不可以只是说,必须实现!」
#
# 与已有 evolve-controller.yml 的分工(别混):
#   · evolve-controller = **观察者**:看指标、开 Issue、给人看。它不改任何东西。
#   · 本 workflow       = **改进者**:诊断真实失败 → 生成下一代方案 → 裁决换冠军。
#                          它是唯一会**真的动系统**的那个环。
#
# 一圈完整的能量路径(跑完这个 workflow 就转一格):
#   雷达 intel_items ──灌──▶ evolve_candidates        (info4AI:进化的来源)
#   产线 held/published ──诊断──▶ 失败原因分布 + 真实样例
#            └──改进者──▶ 新方案 status='trial'        (sueAI:进化的动作)
#   产线 load_variant 按 30% 探索流量喂给挑战者
#            └──复核判 ──▶ settle_trials 按 variant_id 归位 fitness
#                    └──arbitrate──▶ 换冠军 / 淘汰 / 回滚  (QA-Evolution:进化的度量)
#
# 安全边界(自动换冠军**不是**裸奔):
#   · 红线闸:父代有的合规约束子代必须一条不少,少一条直接丢弃不写库(代码里硬判)
#   · 样本闸:judged < EVOLVE_MIN_N 一律不判优劣
#   · 显著闸:必须赢过在位 EVOLVE_MARGIN 才换,平手不换
#   · 回滚闸:换上去之后掉下来自动退回父代 —— 这条是敢自动的底气
#   · 只写 evolve_* 表与提示词,**绝不改已上线内容、绝不删数据、绝不碰产线代码**
#
# 成本:改进者默认走内部免费池网关,零按量计费。
#   Claude API 改进者接口已焊好(--improver claude-api),但**必须**创始人显式提供
#   ANTHROPIC_API_KEY secret 才会启用 —— 脚本自己不会偷偷走计费源。
# ============================================================

name: Evolve Improve

on:
  # ⛔ 2026-08-07 停 cron 止血:本 workflow 的 SCOPES 只有 biocomp/herb,
  #    进化的是**内容产线提示词**——而创始人 2026-08-05 已把「内容工厂」从
  #    雷达模块清单删除,memory `feedback_never_do_tcm_content` 更早立下
  #    「进化对象永远是系统(采集/判定/路由/引擎),不是内容」。
  #    实测 2026-08-07 当天仍按 schedule 自动跑了 4 次 = 每 3 小时违禁一次。
  #    按「可逆动作先止血、再呈报」处理:注释 cron(不点 disable 按钮,
  #    避免自愈机制静默复活),保留 workflow_dispatch 供人工验证。
  #    解除条件:SCOPES 改向系统对象(见《自我进化系统_整体架构_v1》刀0)。
  # schedule:
  #   - cron: '10 */3 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: '产线:biocomp / herb / all'
        required: false
        default: 'all'
      improver:
        description: '改进者:freepool(免费池·默认) / claude-api(按量计费·需创始人开 secret)'
        required: false
        default: 'freepool'
      dry_run:
        description: '只诊断不写库'
        type: boolean
        required: false
        default: false

concurrency:
  group: evolve-improve
  cancel-in-progress: false     # 裁决过程别被打断

jobs:
  improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write            # 工单要落 Issue —— 只写 run log 的工单等于没发过
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # py_compile 查不出 NameError —— 2026-08-04 就是这么白跑一轮的。几百毫秒换一轮 Actions。
      - name: 冒烟 import(真执行模块级代码)
        run: python scripts/evolve/_smoke_import.py

      # import 通过 ≠ 函数能跑 —— 判据类代码必须有真调用的用例(2026-08-04 白跑两轮的教训)
      - name: 离线单元测试(真调用判分函数)
        run: python scripts/evolve/_offline_test.py

      - name: 回归集离线评测(固定卷子给分,不碰生产数据)
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python scripts/evolve/evaluate.py --scope all --items 12 --report evolve_eval.json

      - name: 诊断 → 生成下一代 → 裁决
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          # 没配这个 secret 时为空 → Claude 改进者不会启用,自动留在免费池
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/evolve/improve.py \
            --scope "${{ github.event.inputs.scope || 'all' }}" \
            --improver "${{ github.event.inputs.improver || 'freepool' }}" \
            --report evolve_improve.json \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # 闭环的动作必须能被看见 —— 不许只躺在 run log 里(pan-register 连喊 12 天零人响应的教训)
      # 冻结的考卷必须**跨 runner 存活** —— 缓存落在 runner 上,下一轮是新机器就没了,
      # 那「冻结」在云端等于没冻,Phase 0 的「连跑 3 次一致」永远验不出来。
      # 跟收件箱同一套:提交回仓,下一轮 checkout 自动带着上一轮的卷子。
      - name: 冻结的考卷提交回仓(跨 runner 存活)
        if: always()
        run: |
          if [ -d reports/evolve/eval_cache ] && [ "$(ls -A reports/evolve/eval_cache 2>/dev/null)" ]; then
            n=$(ls reports/evolve/eval_cache | wc -l)
            git config user.name  'evolve-bot'
            git config user.email 'evolve-bot@users.noreply.github.com'
            git add reports/evolve/eval_cache
            git diff --cached --quiet || git commit -m "冻结考卷 +$n 份 $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
            git pull --rebase -q origin main || true
            git push || echo '推送失败(不致命,下轮重来)'
            echo "已提交 $n 份冻结考卷"
          else
            echo "本轮没有产生新考卷"
          fi

      - name: 本轮闭环动作写进 Job Summary
        if: always()
        run: |
          echo "## 自进化闭环 · 本轮动作" >> "$GITHUB_STEP_SUMMARY"
          if [ -f evolve_improve.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("evolve_improve.json", encoding="utf-8"))
          print(f"- 改进者:**{d.get('improver')}**")
          print(f"- 情报灌入候选池:**{d.get('candidates',0)}** 条")
          arb = d.get("arbitrate") or []
          print(f"- 裁决动作:**{len(arb)}** 次")
          for a in arb:
              print(f"  - `{a['scope']}` **{a['action']}** {a['variant']} —— {a['why']}")
          born = d.get("born") or []
          print(f"- 新生挑战者:**{len(born)}** 个")
          for b in born:
              print(f"  - `{b['scope']}` {b['variant']}")
          if not arb and not born:
              print("\n> 本轮没有换代动作(样本没攒够 / 已有挑战者在跑),这是正常的。")
          PY
          else
            echo "> ⚠️ 没生成 report.json,这轮改进环很可能整体失败了。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 2026-08-06 补断头:make_tickets 生成的工单此前只进 run log 与 Summary,
      # 出过一次就标 ticketed 永不再出 —— 「推送给你修改」那一环实际从没送达过
      # (CLAUDE.md 第 8 条:只写进日志的产线一律视为没人看)。
      # 现在:工单非空 → 追评到固定 Issue,标题进手机通知,人看得见才叫推送。
      - name: 工单推送到固定 Issue(治一次性沉没)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f evolve_improve.json ] || exit 0
          # 无工单时输出为空文件;靠"文件非空"判断,不玩退出码(bash -e 下退出码即死)
          python - <<'PY' > tickets_comment.md
          import json
          d = json.load(open("evolve_improve.json", encoding="utf-8"))
          ts = d.get("tickets") or []
          if ts:
              by = {}
              for t in ts:
                  by.setdefault(t.get("module") or "未归类", []).append(t)
              print(f"共 {len(ts)} 张,覆盖 {len(by)} 个模块。**代码级改动走 PR + CI + 人 merge,本工单只提案。**\n")
              for mod, items in by.items():
                  print(f"### {mod}")
                  for t in items:
                      eff = f" · 工作量 {t['effort']}" if t.get("effort") else ""
                      print(f"- **[{t['repo']}]({t.get('url','')})**({t.get('stars','?')}★){eff}")
                      print(f"  - 指标:{t.get('metric','—')} · 接法:{t.get('how','—')}")
          PY
          if [ ! -s tickets_comment.md ]; then echo '本轮无工单,不发'; exit 0; fi
          T='系统改进工单 · 雷达推送给人修'
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "## $(date -u +%Y-%m-%d) · run ${{ github.run_id }}"
            echo ""
            cat tickets_comment.md
          } > tickets_issue.md
          if [ -n "$num" ]; then
          # Periodic report, not an alarm. Body still updates every run;
          # the comment (the part that pings a human) is opt-in, because
          # a daily ping for a green report is what buried the founder's
          # inbox. Routine notification belongs in the weekly digest.
          # Set NOTIFY=1 on a dispatch when you do want to be pinged.
            if [ "${NOTIFY:-0}" = "1" ]; then
              gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body-file tickets_issue.md
            else
              gh issue edit "$num" -R "$GITHUB_REPOSITORY" --body-file tickets_issue.md
            fi
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$T" --body-file tickets_issue.md
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolve-improve-${{ github.run_id }}
          path: evolve_improve.json
          if-no-files-found: warn

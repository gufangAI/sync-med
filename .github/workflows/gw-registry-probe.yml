name: 🔌 GW Registry Probe · 网关注册表探活

# runner 每次独立 IP —— 能测到 CF 出网打不通的免费源（opencode 在 CF 侧固定 429、
# NVIDIA 曾 503）。这是把探活放这里而不是 Workers 的唯一理由，也是这条产线的价值所在。
#
# 只回写 status / latency_ms / checked_at；人工维护的字段不碰。

on:
  schedule:
    - cron: '20 3 * * *'        # 每日 03:20 UTC = 北京 11:20，与 lane-probe 同节奏
  workflow_dispatch:
    inputs:
      probe_all:
        description: '连 candidate 一起探（默认只探 enabled）'
        type: boolean
        default: false

concurrency:
  group: gw-registry-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 探活
        env:
          PROBE_ALL:           ${{ inputs.probe_all && '1' || '0' }}
          SENSENOVA_API_KEY:   ${{ secrets.SENSENOVA_API_KEY }}
          NVIDIA_NIM_API_KEY:  ${{ secrets.NVIDIA_NIM_API_KEY }}
          ZHIPU_API_KEY:       ${{ secrets.ZHIPU_API_KEY }}
          TENCENT_API_KEY:     ${{ secrets.TENCENT_API_KEY }}
          CEREBRAS_API_KEY:    ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          MODELSCOPE_API_KEY:  ${{ secrets.MODELSCOPE_API_KEY }}
          SILICONFLOW_KEY:     ${{ secrets.SILICONFLOW_KEY }}
          AGNES_API_KEY:       ${{ secrets.AGNES_API_KEY }}
          AGNES_CN_API_KEY:    ${{ secrets.AGNES_CN_API_KEY }}
          LONGCAT_API_KEY:     ${{ secrets.LONGCAT_API_KEY }}
          DASHSCOPE_API_KEY:   ${{ secrets.DASHSCOPE_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          XF_MAAS_KEY:         ${{ secrets.XF_MAAS_KEY }}
        run: python gateway/gw_probe.py

      - name: 回写注册表
        run: |
          git config user.name  "gw-probe"
          git config user.email "gw-probe@users.noreply.github.com"
          git add gateway/providers.json
          git diff --staged --quiet || git commit -m "chore(gw): 注册表探活回写 $(date -u +%F)"
          git push

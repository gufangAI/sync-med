name: _diag_gen
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - env:
          GW_KEY: ${{ secrets.GW_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          cd scripts/content_factory
          python - <<'PY'
          import sys, traceback, urllib.request, json, os
          sys.path.insert(0,".")
          import _ai
          # 复刻工厂 generation 真正的调用:长 system + json_mode
          SYS = "你是中医药资料助手。"*40  # 模拟 793 字节长 system
          try:
              t,m = _ai.ask(SYS, "药材:Neem。输出JSON。", max_tokens=2600)
              print("long-sys ask OK:", m, repr(t[:60]))
          except urllib.error.HTTPError as e:
              print("long-sys RAISED HTTPError", e.code)
              print("BODY:", e.read().decode("utf-8","replace")[:300])
          except Exception as e:
              print("long-sys RAISED:", type(e).__name__, str(e)[:200])
          # 再测:直接原始 urllib 打网关,把 401 body 完整读出
          import os
          payload=json.dumps({"messages":[{"role":"system","content":SYS},{"role":"user","content":"药材:Neem。输出JSON。"}],"max_tokens":2600,"json":True,"source":"content_factory","temperature":0.3}).encode()
          req=urllib.request.Request(_ai.GATEWAY,method="POST",data=payload,headers={"Content-Type":"application/json; charset=utf-8","User-Agent":"nova/1","X-Gateway-Key":os.environ["GW_KEY"]})
          try:
              print("RAW STATUS", urllib.request.urlopen(req,timeout=60).status)
          except urllib.error.HTTPError as e:
              print("RAW", e.code, "BODY:", e.read().decode("utf-8","replace")[:300])
          PY

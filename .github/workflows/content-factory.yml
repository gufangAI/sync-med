# ============================================================
# 内容工厂 · 本草 / 生物计算 持续丰富
#
# 立此因(2026-08-02 创始人):
#   「生物计算、本草,不可以派个 GitHub 的任务,或者派个 AI 去一直丰富内容吗」
#   「我们的主要价值是在丰富功能,而不是在修修补补」
#   「不停的产出结果,丰富我们的内容,那才是价值」
#
# 原状:bencao.html 8KB / shengwu.html 9KB,条目全部硬编码在 HTML 里,
#   加一条要改代码重新部署 —— 两个多月一条没长过。
# 现在:cron 自动跑 → 免费池生成 → 合规硬闸 → 写 D1(draft) → 后台审核上线。
#
# 成本:全程只走内部免费池网关,零按量计费;公开仓 standard runner,Actions 分钟不计费。
# 安全:入库一律 status='draft',**绝不自动上线**;含剂量/疗效承诺的整条丢弃并计数。
# ============================================================

name: Content Factory

# ── 产能调优(2026-08-02,依据上一轮 run 30732622418 的真实数字)────────────
#   实测原状:49 分钟 → 入库 21 · 失败 14(失败率 40%,全是 JSONDecodeError)。
#   三处根因已修:①解析器改 raw_decode(治 "Extra data",9/14)
#                ②max_tokens 1400→2600 + 重试放大到 3400(治 "Unterminated string",5/14)
#                ③串行改 6 路并发(单条网关调用 1~2 分钟,串行是产能的真瓶颈)
#   本文件配套改:每轮 6 条 → 30 条;两条产线拆成并行 job(原来串一个 job 墙钟白白翻倍);
#                cron 6 小时 → 3 小时。合计日产上限 6×2×4=48 → 30×2×8=480。
on:
  schedule:
    - cron: '20 */3 * * *'    # 每 3 小时一轮,本草与生物计算并行各 30 条
  workflow_dispatch:
    inputs:
      target:
        description: '产线(herb / biocomp / both)'
        required: false
        default: 'both'
      count:
        description: '本轮每条产线生成条数'
        required: false
        default: '30'
      explore:
        description: '挑战者分流比例(留空=默认 30%;设 1 = 本轮全给挑战者,用于把样本一次攒够)'
        required: false
        default: ''
      workers:
        description: '并发路数(免费池网关,6 是实测不触发限流的稳妥值)'
        required: false
        default: '6'

concurrency:
  group: content-factory
  cancel-in-progress: false     # 内容生成不抢占,排队跑完更重要

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false          # 一条产线挂了不能拖累另一条
      matrix:
        target: [herb, biocomp]
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成入库
        # both(或 cron 无 inputs)时两条都跑;指定单条时另一条跳过
        if: ${{ github.event.inputs.target == '' || github.event.inputs.target == 'both' || github.event.inputs.target == matrix.target }}
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          CF_WORKERS:     ${{ github.event.inputs.workers || '6' }}
          # 留空时脚本用默认 0.30。A/B 分流比例可临时调 —— 挑战者卡在样本闸时
          #   设 1 让这一轮全给它,当轮就凑够 25 条交给裁决判,不用等好几轮随机。
          EVOLVE_EXPLORE: ${{ github.event.inputs.explore }}
          PYTHONIOENCODING: utf-8
        run: python scripts/content_factory/herb_factory.py --target ${{ matrix.target }} --count ${{ github.event.inputs.count || '30' }}

      # ── 独立复核:draft → published ────────────────────────────────
      # 立此因(2026-08-02 实测):工厂产出的 92 条**全部卡在 draft**,published 零条。
      #   原设计「入库 draft,人工审核后上线」没有审核人 = 死结,跑再多前台也看不见。
      #   解法不是拆闸门,是让闸门能真运转:生成一个模型,复核**换另一个更强的模型**,
      #   两个模型独立同意才放行;有疑点转 held 留人工,不再反复复核。
      #   实测 6 条样本:放行 3 / 按住 3,按住理由具体(靶点无出处、体外与临床混淆、英文名错)——
      #   是真在挑毛病,不是盖章。
      - name: 独立复核放行
        if: ${{ github.event.inputs.target == '' || github.event.inputs.target == 'both' || github.event.inputs.target == matrix.target }}
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          CF_WORKERS:     ${{ github.event.inputs.workers || '6' }}
          PYTHONIOENCODING: utf-8
        run: python scripts/content_factory/reviewer.py --target ${{ matrix.target }} --limit 60

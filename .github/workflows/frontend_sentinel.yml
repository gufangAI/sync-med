name: frontend-sentinel

# Real-user-perspective hourly check of gufangai.com. Built 2026-07-25 after the
# founder caught /overseas serving a large share of degraded text-placeholder
# covers -- something the platform's own self-check missed because it used
# the wrong criterion (counted the degradation as success). The point of this
# workflow is that the platform finds its own problems, instead of waiting for
# a screenshot and a phone call.
#
# Read-only against production: scripts/sentinel/check_frontend.py only issues
# D1 SELECT (via the D1 HTTP API) and GETs/POSTs the same public endpoints any
# real visitor hits. The only repo writes this workflow makes are its own
# reports/sentinel/*.json trend files, guarded below to never touch anything
# else. No Issue is opened when everything passes -- only the run summary
# gets the metrics table, to avoid alert-fatigue noise.

on:
  schedule:
    - cron: '20 * * * *'   # hourly, offset from :00 to avoid piling on other hourly jobs
  workflow_dispatch:

concurrency:
  group: frontend-sentinel
  cancel-in-progress: true

permissions:
  contents: write   # only to commit reports/sentinel/*.json (guarded below)
  issues: write      # only alert path: create/update the day's Issue

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet requests

      - name: run frontend sentinel checks
        id: sentinel
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
        run: python scripts/sentinel/check_frontend.py

      - name: commit trend report (reports/sentinel only)
        if: always()
        run: |
          set -e
          git config user.name  "frontend-sentinel[bot]"
          git config user.email "frontend-sentinel@users.noreply.github.com"
          git add -- reports/sentinel || true
          STAGED=$(git diff --cached --name-only)
          if [ -z "$STAGED" ]; then
            echo "nothing to commit"
            exit 0
          fi
          OUTSIDE=$(echo "$STAGED" | grep -v '^reports/sentinel/' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::frontend-sentinel tried to commit files outside reports/sentinel/:"
            echo "$OUTSIDE"
            exit 1
          fi
          echo "$STAGED"
          git commit -m "frontend-sentinel report $(date -u +%FT%H:%M) [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: create or update today's alert Issue
        if: always()
        uses: actions/github-script@v7
        env:
          ALERT_COUNT: ${{ steps.sentinel.outputs.alert_count }}
          TODAY_BJ:    ${{ steps.sentinel.outputs.today_bj }}
          TIME_BJ:     ${{ steps.sentinel.outputs.time_bj }}
          REPORT_BODY: ${{ steps.sentinel.outputs.report_body }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const alertCount = parseInt(process.env.ALERT_COUNT || '0', 10);
            if (!alertCount) {
              console.log('all checks passed, no Issue opened (summary already has the metrics table)');
              return;
            }
            const today = process.env.TODAY_BJ;
            const timeBj = process.env.TIME_BJ;
            const reportBody = process.env.REPORT_BODY || '(report body empty, check the run log)';
            const label = 'frontend-sentinel';
            const newTitle = `🚨 前台体验异常 ${today} ${timeBj}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 30,
            });
            const existing = openIssues.find(i => i.title.includes(`前台体验异常 ${today}`));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: reportBody,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: newTitle,   // bump the timestamp so the title shows the latest bad reading
              });
              console.log(`appended comment to existing issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: newTitle,
                body: reportBody,
                labels: [label],
              });
              console.log(`created issue #${created.number}: ${created.html_url}`);
            }

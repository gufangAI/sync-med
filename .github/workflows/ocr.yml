name: ocr

on:
  workflow_dispatch:
    inputs:
      total:
        description: shard count (concurrency)
        default: "256"
      pilot:
        description: pilot page cap per shard (empty = full run)
        default: ""
  # 2026-07-22 退休旧版:本 ocr.py 直读已迁走(2026-07-17→123)的 R2 book/ 影像,全 404 烧 Class B。
  # 正确版 ocr_ndl.py(从123取图)已在跑(cron 半点)、OCR 同一批书、落同一 _ocr/ 位置——是新旧两版,
  # 团队改新版时漏停旧版导致并行烧钱。此处停掉旧版自动 cron,保留 workflow_dispatch 手动兜底。
  # schedule:
  #   - cron: '0 */6 * * *'

concurrency:
  group: ocr-run
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.g.outputs.shards }}
    steps:
      - id: g
        run: python -c "import json,os;print('shards='+json.dumps(list(range(int(os.environ['T'])))))" >> "$GITHUB_OUTPUT"
        env:
          T: ${{ github.event.inputs.total || '256' }}

  run:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8   # was 256: org-wide Free-plan Actions concurrency ceiling is ~20 jobs shared
                        # across the whole hosonzuo8848 org; 256 let one ocr.yml tick monopolize all of it
                        # for hours, starving every other repo/workflow (2026-07-16 queue-jam root cause).
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install --quiet rapidocr-onnxruntime boto3 requests pillow "numpy<2"
      - name: restore ledger cache
        uses: actions/cache/restore@v4
        with:
          path: ledger.json
          key: ocr-ledger-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ocr-ledger-s${{ matrix.shard }}-
      - run: python ocr.py
        env:
          S_EP: ${{ secrets.S_EP }}
          S_AK: ${{ secrets.S_AK }}
          S_SK: ${{ secrets.S_SK }}
          S_BUCKET: ${{ secrets.S_BUCKET }}
          ALLOW_KEY: ${{ secrets.ALLOW_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ github.event.inputs.total || '256' }}
          PILOT: ${{ github.event.inputs.pilot }}
          # 123 pan credentials. book/ imagery left R2 on 2026-07-17, so without
          # these pan_fetch.available() is False and every shard falls back to the
          # 07-22 stop-gap and exits -- which is exactly the five days of zero
          # output this is meant to end. An absent secret must read as a missing
          # capability in the log, not as "nothing to do".
          #
          # These are the pair that owns the book page folders: ocr_ndl.yml
          # fetches the same page_NNNN.webp files with them every cron tick.
          # This step used to pass CTEXT_PAN_CID/SEC, which ctext_harvest.yml
          # wires as a different pan account's PAN_CID/PAN_SEC -- a valid token
          # for an account that cannot see these folders, so every listing came
          # back empty and every shard reported a clean zero.
          PAN_CLIENT_ID: ${{ secrets.PAN_CLIENT_ID }}
          PAN_CLIENT_SECRET: ${{ secrets.PAN_CLIENT_SECRET }}
      - name: save ledger cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ledger.json
          key: ocr-ledger-s${{ matrix.shard }}-${{ github.run_id }}
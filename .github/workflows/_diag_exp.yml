name: _diag_exp
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - env:
          GW_KEY: ${{ secrets.GW_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          cd scripts/content_factory
          python - <<'PY'
          import sys, traceback, os
          sys.path.insert(0, ".")
          import _ai
          print("=== 1) opencode 直发(看它现在返回什么) ===")
          try:
              t,m = _ai.ask_opencode("你是助手","列3个中药活性成分,以[开头输出JSON数组")
              print("opencode OK:", repr(t[:80]))
          except Exception as e:
              print("opencode RAISED:", type(e).__name__, str(e)[:150])
          print("=== 2) 回落网关 ask(supplier=zhipu) ===")
          try:
              t,m = _ai.ask("你是助手","列3个中药活性成分,以[开头输出JSON数组", max_tokens=800, supplier="zhipu")
              print("ask(zhipu) OK model=%s: %r" % (m, t[:80]))
          except Exception as e:
              print("ask(zhipu) RAISED:", type(e).__name__, str(e)[:200])
          PY

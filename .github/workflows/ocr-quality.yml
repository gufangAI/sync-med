# Score our OCR against a known-good edition of the same work.
#
# The bridge pulls in millions of characters of our own OCR. Bad OCR is not
# neutral -- the old tcm-rag-768 index holds 1.828M vectors of degraded scans
# (pages returned as 700 repetitions of a single character, or as kana) and
# returns zero usable hits on any query, because the noise outranks the signal.
#
# We already hold typed editions of many of the same works: 788 from daizhige,
# 194 from wikisource, 100 from kanripo. Where a work appears on both sides the
# typed edition is ground truth, so accuracy is measurable rather than assumed.
name: ocr-quality

on:
  schedule:
    - cron: '50 5 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: "books to compare"
        required: false
        default: "40"

concurrency:
  group: ocr-quality
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet boto3 requests
      - name: compare OCR against typed editions
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          R2_ENDPOINT:    ${{ secrets.VEC_R2_ENDPOINT }}
          R2_ACCESS_KEY:  ${{ secrets.VEC_R2_ACCESS_KEY }}
          R2_SECRET_KEY:  ${{ secrets.VEC_R2_SECRET_KEY }}
          SAMPLE:         ${{ github.event.inputs.sample || '40' }}
        run: python ocr_quality_gate.py

name: _diag_gwkey
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          GW_KEY: ${{ secrets.GW_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          k = os.environ["GW_KEY"]
          req = urllib.request.Request("https://gufangai.com/api/gateway/chat", method="POST",
              data=json.dumps({"messages":[{"role":"user","content":"ping"}],"max_tokens":8,
                               "json":True,"source":"content_factory"}).encode(),
              headers={"Content-Type":"application/json","X-Gateway-Key":k,"User-Agent":"content-factory/1.0"})
          try:
              r = urllib.request.urlopen(req, timeout=40)
              print("STATUS 200"); print(r.read()[:200])
          except urllib.error.HTTPError as e:
              print("STATUS", e.code)
              print("BODY:", e.read().decode("utf-8","replace")[:400])
              print("HDRS:", dict(e.headers))
          PY

name: _diag_real
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - env:
          GW_KEY: ${{ secrets.GW_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          cd scripts/content_factory
          python - <<'PY'
          import sys, traceback, time
          sys.path.insert(0,".")
          import herb_factory as H, _ai
          # 用工厂真正的入口 gen_herb + 真 ACTIVE_SYS(它读方案槽)
          import _variant
          slot="SYS_HERB"
          try:
              _variant.seed_variant("herb", slot, H.SYS_HERB, author="cto", note="x")
              ACTIVE,VID = _variant.load_variant("herb", slot, H.SYS_HERB)
              print("ACTIVE_SYS len=%d vid=%s" % (len(ACTIVE), VID))
          except Exception as e:
              print("load_variant RAISED:", type(e).__name__, str(e)[:150]); ACTIVE=H.SYS_HERB
          t0=time.time()
          try:
              obj,model = H.gen_herb("Neem","Azadirachta indica", sys_prompt=ACTIVE)
              print("gen_herb OK %dms model=%s: %r" % ((time.time()-t0)*1000, model, str(obj)[:80]))
          except Exception as e:
              print("gen_herb RAISED %dms:" % ((time.time()-t0)*1000), type(e).__name__, str(e)[:200])
              traceback.print_exc()
          PY

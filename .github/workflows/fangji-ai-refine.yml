name: fangji-ai-refine

# Formula library AI refinement.
#
# Why: the regex miner grounds every field in the source text, but grounding is not
# semantics -- "with four sheng of water" IS in the source yet is a decoction step,
# not a herb. Roughly half the composition fields hold procedure text, not herbs.
#
# Model race, redone 2026-07-26 12:2x on a FIXED shared sample (the first race was
# invalid: each supplier drew a different batch because the worker filters on
# ai_ok IS NULL, so whoever ran first consumed the rows -- seven suppliers graded on
# seven different exam papers. That bad comparison is what got NVIDIA cut at "7%").
#
# Fair numbers, same 20 rows for everyone, counting hallucinations rather than
# "pass" (a correct "this is not a formula" verdict is a success, not a failure):
#   nvidia   20/20 valid, 0 hallucinations   <- best
#   xf_qwen  19/20 valid, 1 hallucination    <- fastest, 18429 rows done in 2h
#   zhipu    10/20 valid, 10 hallucinations
#   agnes / modelscope: fail inside Actions (14 and 39 rows in two hours)
#   siliconflow / cerebras: malformed output
# So: xf_qwen + nvidia. agnes/modelscope dropped for non-delivery, not for quality.
#
# Cost: zero. All three are free tiers reached through the platform's own gateway,
# so no credentials live in this public repo.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: rows per shard
        default: '25000'
      workers:
        description: concurrency per shard
        default: '5'
  schedule:
    - cron: '20 */6 * * *'   # keeps up with newly mined formulas; script is idempotent

concurrency:
  group: fangji-ai-refine
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - supplier: xf_qwen
            shard: 0
          - supplier: nvidia
            shard: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: refine shard
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
        run: |
          python scripts/fangji_ai_refine.py \
            --supplier ${{ matrix.supplier }} \
            --shard ${{ matrix.shard }} --total 2 \
            --limit ${{ github.event.inputs.limit || 25000 }} \
            --workers ${{ github.event.inputs.workers || 5 }}

name: formula-mine

# Formula-library production mining (GitHub Actions matrix, free).
# Input = a segment of formula_worklist.json, which since 2026-07-25 is the
# WHOLE compliance-allowed corpus (generated by gen_formula_worklist.py from
# books_text.allow_sueai_extract=1), not the 85-book formula-book subset the
# Phase0 census had hand-picked. The segment is expanded to VOLUME work-units
# and those are dealt round-robin across `shards` matrix workers -- volume,
# not book, because a single compendium (Puji Fang: 375 volumes, 56443 raw
# candidate windows) would otherwise pin one shard far past the 6h job
# ceiling while the rest idle.
# Each worker processes its units' FULL candidate-window set through the
# 3-gate LLM structuring pipeline and writes a per-shard JSONL artifact.
# No ceilings by default: limit=0 (whole worklist), per_name_cap=0 (no
# same-name cap), max_units=0 (no volume cap). Duplicate work is removed by
# content -- identical windows are hashed out, books already in sue_formulas
# are skipped when skip_done=1.
#
# Shard sizing: ~25 windows/min/shard measured at conc=10, and a job may run
# 350 min, so one shard absorbs ~8700 windows. The full 505-book pool is
# ~378000 raw windows -> ~44 shards; the 420 books the old worklist omitted
# are ~231000 -> ~27 shards. Default 32 covers the usual "everything not yet
# mined" dispatch with margin. max-parallel stays 8 (see the run job).
#
# Read-only against D1/R2 (D1 SELECT only, R2 get_object by constructed key
# only -- guard_no_list.yml CI-enforces no list_objects/get_paginator
# anywhere in the repo). Writes nothing to any production table/bucket.

on:
  workflow_dispatch:
    inputs:
      source:
        description: d1 (compliance-gated books_text corpus) or r2text (flat one-txt-per-book mirror)
        type: choice
        options: ["d1", "r2text"]
        default: "d1"
      offset:
        description: start index into the worklist
        default: "0"
      limit:
        description: books from offset to include; 0 = to the end of the worklist (production default)
        default: "0"
      shards:
        description: matrix shard count (see shard-sizing note in the header)
        default: "32"
      conc:
        description: per-shard LLM thread concurrency
        default: "10"
      per_name_cap:
        description: SMOKE TEST ONLY -- max windows per (book, formula-name). 0 = no cap (required for production runs)
        default: "0"
      max_units:
        description: SMOKE TEST ONLY -- cap volume units per shard. 0 = unlimited (required for production runs)
        default: "0"
      skip_done:
        description: >-
          DANGEROUS, leave 0. 1 drops any book with at least one row in sue_formulas regardless of how
          little of it was mined (Puji Fang had 39 rows against 56443 windows). Only for books verified complete.
        default: "0"

concurrency:
  # Per-segment, not per-workflow. A single global group meant a 20-minute
  # validation dispatch had to sit behind a multi-hour production run (and
  # cancel-in-progress is false, correctly, because killing a running miner
  # throws away its ledger). Two dispatches over the same segment still
  # serialize, which is what actually protects the shared ledger cache.
  group: formula-mine-${{ github.event.inputs.source || 'd1' }}-o${{ github.event.inputs.offset || '0' }}-l${{ github.event.inputs.limit || '0' }}
  cancel-in-progress: false

env:
  # One ledger namespace per (worklist version, source, segment) so a resumed
  # dispatch restores its own partial work and never inherits a different
  # segment's windows. Bump wlN whenever formula_worklist.json is regenerated:
  # offsets mean different books after a regen, so an old ledger would resume
  # the wrong work. wl2 = the 2026-07-25 whole-corpus worklist.
  LEDGER: formula-mine-ledger-wl2-${{ github.event.inputs.source || 'd1' }}-o${{ github.event.inputs.offset || '0' }}-l${{ github.event.inputs.limit || '0' }}

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.g.outputs.shards }}
    steps:
      - id: g
        run: python -c "import json,os;print('shards='+json.dumps(list(range(int(os.environ['T'])))))" >> "$GITHUB_OUTPUT"
        env:
          T: ${{ github.event.inputs.shards || '32' }}

  run:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8   # org-wide Free-plan concurrency ceiling, shared with ocr.yml/ocr_ndl.yml/align_full.yml
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet boto3 requests
      - name: restore ledger cache
        uses: actions/cache/restore@v4
        with:
          path: formula_mine_result_shard${{ matrix.shard }}.jsonl
          key: ${{ env.LEDGER }}-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.LEDGER }}-s${{ matrix.shard }}-
      - run: python formula_mine.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          S_EP: ${{ secrets.S_EP }}
          S_AK: ${{ secrets.S_AK }}
          S_SK: ${{ secrets.S_SK }}
          S_BUCKET: ${{ secrets.S_BUCKET }}
          AGNES_API_BASE: ${{ secrets.AGNES_API_BASE }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_TEXT_MODEL: ${{ secrets.AGNES_TEXT_MODEL }}
          XF_KEYS: ${{ secrets.XF_KEYS }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ github.event.inputs.shards || '32' }}
          OFFSET: ${{ github.event.inputs.offset || '0' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          CONC: ${{ github.event.inputs.conc || '10' }}
          SOURCE: ${{ github.event.inputs.source || 'd1' }}
          PER_NAME_CAP: ${{ github.event.inputs.per_name_cap || '0' }}
          MAX_UNITS: ${{ github.event.inputs.max_units || '0' }}
          # Explicit comparison, not `inputs.skip_done || '0'`: GitHub casts the
          # string "0" to a falsy number, so the || form silently rewrites the
          # value. Only a literal "1" turns the book-level skip on.
          SKIP_DONE: ${{ github.event.inputs.skip_done == '1' && '1' || '0' }}
      - name: save ledger cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: formula_mine_result_shard${{ matrix.shard }}.jsonl
          key: ${{ env.LEDGER }}-s${{ matrix.shard }}-${{ github.run_id }}
      - name: upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formula-mine-shard-${{ matrix.shard }}
          path: formula_mine_result_shard${{ matrix.shard }}.jsonl
          if-no-files-found: warn
          retention-days: 30

  summarize:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: formula-mine-shard-*
          path: shards
          merge-multiple: true
      - run: python formula_mine.py --summarize shards
      - name: upload merged artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formula-mine-final
          path: |
            formula_mine_final.jsonl
            formula_mine_stats.json
          if-no-files-found: warn
          retention-days: 30

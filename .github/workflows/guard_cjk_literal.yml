name: guard-cjk-range-literal

# cjk_charset.py 的文件头写着「不许再写一行字面量区间」——
# 这条规矩在 docstring 里躺了四个月，没有任何东西执行它，于是仓里又长出 8 处。
# 本 workflow 把那句话变成 CI。做成**棘轮**：存量按 baseline 放行，只拦新增。
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 不许再出现第二份 CJK 区间字面量
        run: python scripts/guard_cjk_literal.py

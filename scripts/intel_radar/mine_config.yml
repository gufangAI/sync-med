# ═══════════════════════════════════════════════════════════════════════
# 鹰眼挖掘范围配置  ——  这个文件是给人改的,改完提交就生效,不用动代码
# ═══════════════════════════════════════════════════════════════════════
#
# 为什么有这个文件(创始人 2026-09-02):
#   「建好在后台,也可以自己配置搜索的范围」
#   「你可以想到的有限,这些是要去挖掘的」
#
# 原来鹰眼的搜索范围写死在 arsenal_radar.py 的 scan_plan() 里,想扩一个赛道
# 就得改代码。实测代价:整条爬虫赛道从没写进去过,于是 firecrawl(175,415★)、
# browser-use(112,014★)、crawl4ai(80,997★) 在雷达上**根本不存在**。
#
# 现在改成:你在下面加一行,鹰眼下一轮就看得见。
#
# ── 怎么改 ────────────────────────────────────────────────────────────
#   想让鹰眼盯一个新赛道 → 在 seeds 里加一个你知道的代表项目就行。
#   剩下的它自己顺着图爬:同榜单的、同 topic 的、同一批人 star 的,都会被挖出来。
#   **你不需要列全**,列一个代表就够 —— 列全是它的活,不是你的活。
# ─────────────────────────────────────────────────────────────────────

# ① 种子仓:每个赛道给一两个你确定的代表项目
#    挖掘引擎从这里出发做图遍历,自己长出整片视野。
seeds:
  爬虫与抓取:
    - firecrawl/firecrawl            # 175,415★ AGPL 传染,只能读架构
    - unclecode/crawl4ai             #  80,997★ Apache
    - D4Vinci/Scrapling              #  77,867★ BSD 反爬绕过
    - apify/crawlee                  #  25,605★ Apache 代理轮换+指纹
  浏览器自动化:
    - browser-use/browser-use        # 112,014★ MIT AI 操控浏览器
    - microsoft/playwright           #  95,515★ Apache
  AI网关与免费池:
    - BerriAI/litellm                #  57,798★ 100+ 模型统一接口
    - Portkey-AI/gateway             #  12,875★ 自带 wrangler.toml,跟我们同运行时
    - router-for-me/CLIProxyAPI      #  49,851★ MIT 把订阅额度包装成 API
    - xtekky/gpt4free                #  66,623★ 免费源逆向
  深度研究agent:
    - assafelovic/gpt-researcher
    - ItzCrazyKns/Perplexica
  视频与内容产线:
    - harry0703/MoneyPrinterTurbo
    - remotion-dev/remotion
    - heygen-com/hyperframes         #  43,648★ Apache「写HTML渲染视频·为agent而生」
    - browser-use/video-use          #  23,240★ MIT「用 coding agent 剪视频」
    - nexu-io/html-video             #   4,504★ Apache HTML→视频
  agent技能库:
    - K-Dense-AI/scientific-agent-skills  # 41,858★ MIT 165个科学skill+100+数据库
    - Panniantong/Agent-Reach        #  77,468★ 挖掘引擎自己挖到的
  古籍OCR与版面:
    - RapidAI/RapidOCR
    - opendatalab/MinerU

# ② 榜单矿脉:awesome 清单本身没有吸收价值,但它 README 里躺着几百个项目链接。
#    引擎会递归读它的**所有 markdown 子文件**(榜单常拆成 python.md/js.md,
#    只读主 README 会漏掉绝大多数 —— 实测漏掉过 90% 以上)。
awesome_sources:
  - lorien/awesome-web-scraping
  - BruceDone/awesome-crawler
  - steven2358/awesome-generative-ai
  - e2b-dev/awesome-ai-agents
  - punkpeye/awesome-mcp-servers
  - Shubhamsaboo/awesome-llm-apps

# ②′ 排行榜矿脉:别人**已经排好序**的榜,一次 API 调用吃一整批,性价比最高。
#     (创始人 2026-09-02 直接甩过来的源,已验真身)
ranking_sources:
  # EvanLi/Github-Ranking 12,051★ MIT —— 每日跑全球 star 排行并生成 md
  # Top100/ 下按语言分文件。只取跟我们产线相关的语言,不全拉(拉全没意义还费配额)
  - repo: EvanLi/Github-Ranking
    paths:
      - README.md                 # 总榜
      - Top100/Python.md
      - Top100/TypeScript.md
      - Top100/JavaScript.md
      - Top100/Go.md
      - Top100/Rust.md
  # OpenGithubs/github-monthly-rank 1,530★ —— 每月飙升榜 top30。
  # 存量榜看不见新星,飙升榜专补这块
  - repo: OpenGithubs/github-monthly-rank

# ②″ Trending 矿脉:github.com/trending,不吃 API 配额(走 HTML)。
#     排行榜看**存量总星**(老仓占优),trending 看**当下涨势**(新仓才露头),两者互补。
trending:
  ranges: [daily, weekly, monthly]
  langs: [null, python, typescript, go]   # null = 全语言总榜

# ③ 挖掘参数
mining:
  topic_hops: 2          # 话题图爬几跳。2 跳够用;3 跳话题会爆炸且噪声骤增
  topic_min_stars: 500   # 话题搜索的星数下限。调低=挖得广但杂
  per_topic: 30          # 每个话题取前几名
  awesome_max_files: 12  # 每张榜单最多读几个 md 文件
  enable_costars: false  # 同好矿脉(协同过滤)。很费配额,想深挖时才开
  api_budget: 900        # 本轮最多打多少次 GitHub API。5000/小时是总配额,
                         # 留足余量给雷达主扫描,别把配额烧穿害它跑不起来

# ④ 相关性判据:挖回来的东西按这些词打分,决定谁进候选榜
#    (只影响排序与呈现,不影响挖掘本身 —— 挖是挖全,筛是另一回事)
relevance:
  # 命中任一即视为与我们产线相关
  our_lines:
    - crawl
    - scrap
    - spider
    - browser
    - ocr
    - rag
    - retrieval
    - embedding
    - vector
    - gateway
    - proxy
    - llm
    - agent
    - video
    - tts
    - subtitle
    - remotion
    - ffmpeg
    - publish
    - automation
    - mcp
    - skill
  # 命中即降权:这些是"看着热闹但吸收不了"的类型
  # (实测教训:雷达曾把 awesome-godot 游戏引擎榜、awesome-geojson 地理数据榜、
  #  garmin_mcp 佳明手表 当候选送上来,占掉了 firecrawl 的位置)
  noise:
    - awesome-list
    - tutorial
    - course
    - roadmap
    - interview
    - cheatsheet
    - book
    - blog
    - resume
    - wallpaper
    - dotfiles
    - game-development
    - godot
    - unity
    - minecraft
